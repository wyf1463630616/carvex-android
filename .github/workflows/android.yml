name: Android signed APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 纯 JVM 的协议与宿主测试：与品牌无关，单独一个 job，和下面的打包 job 并行跑。
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode comes from `git rev-list --count HEAD`, so real history is required.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache required Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api37.0-tools36.0.0-v1
      - name: Ensure required Android SDK packages
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          fi
      # 签名材料随仓库公开，CI 与本地构建共用 .signing/ 下的同一份配置，不再依赖 secrets。
      - name: Verify published signing material
        shell: bash
        run: |
          set -euo pipefail
          test -s .signing/keystore.properties
          test -s .signing/release.jks
          # artifacts/ 被 .gitignore 忽略，新检出的工作区里不存在；后续 tee 与 upload 都依赖它。
          mkdir -p artifacts
          echo "Using tracked signing material from .signing/"
      - name: Protocol and host tests
        shell: bash
        run: |
          # runner 以 bash -e 启动，必须显式 +e：否则流水线一失败脚本就退出，
          # 后面的 PIPESTATUS 判定与失败注释都执行不到。
          set +e
          set -uo pipefail
          chmod +x gradlew
          mkdir -p artifacts
          ./gradlew :protocol-carplay:testDebugUnitTest :pcm-core:test :host-api:test \
            :bridge:testDebugUnitTest :host-carlife-mixing:testDebugUnitTest \
            --build-cache --parallel --configuration-cache --stacktrace --console=plain 2>&1 | tee artifacts/build.log
          # PIPESTATUS[0] 是 Gradle，[1] 是 tee。tee 失败也要单独暴露出来。
          gradle_status="${PIPESTATUS[0]}"
          tee_status="${PIPESTATUS[1]:-0}"
          status="$gradle_status"
          if [[ "$gradle_status" -eq 0 && "$tee_status" -ne 0 ]]; then
            status="$tee_status"
          fi
          if [[ "$status" -ne 0 ]]; then
            excerpt="$(grep -n -E 'FAILURE:|What went wrong|^e: |error:|Lint found [0-9]+ error' -A 20 artifacts/build.log 2>/dev/null | tail -n 60)"
            [[ -n "$excerpt" ]] || excerpt="$(tail -n 60 artifacts/build.log 2>/dev/null)"
            {
              echo '### Protocol tests failed'
              echo ''
              echo "\`gradle=${gradle_status} tee=${tee_status}\`"
              echo ''
              echo '```text'
              printf '%s\n' "$excerpt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # check-run 注释匿名可读，日志不是。把前几行错误压成一行发出去。
            msg="$(printf '%s\n' "$excerpt" | grep -v '^[[:space:]]*$' | head -n 8 \
              | tr '\n' ' ' | tr -s ' ' | cut -c1-900 | sed 's/%/%25/g')"
            echo "::error title=Protocol tests failed (gradle=${gradle_status}, tee=${tee_status})::${msg}"
          fi
          exit "$status"
      - name: Reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}-protocol
          path: |
            artifacts/build.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

  # 只构建 xiaomi 一个 flavor：这是本 fork 自用的出包通道，不做五品牌矩阵。
  # 需要全量品牌校验时按 README 的本地命令跑，或临时把这里改回矩阵。
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: apk (xiaomi)
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache required Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api37.0-tools36.0.0-v1
      - name: Ensure required Android SDK packages
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          fi
      - name: Verify published signing material
        shell: bash
        run: |
          set -euo pipefail
          test -s .signing/keystore.properties
          test -s .signing/release.jks
          mkdir -p artifacts
          echo "Using tracked signing material from .signing/"
      - name: Unit tests, lint and signed APK (xiaomi)
        shell: bash
        run: |
          set +e
          set -uo pipefail
          chmod +x gradlew
          mkdir -p artifacts
          # lint 必须点名到 flavor：:app 有 flavor 后 AGP 只生成 lint<Brand>Release，
          # 没有聚合的 lintRelease——写 lintRelease 会在任务选择阶段报 ambiguous，
          # 什么都不跑就失败。
          ./gradlew ":app:testXiaomiDebugUnitTest" \
            ":app:lintXiaomiRelease" \
            ":app:assembleXiaomiRelease" \
            --build-cache --parallel --configuration-cache --stacktrace --console=plain 2>&1 | tee artifacts/build.log
          gradle_status="${PIPESTATUS[0]}"
          tee_status="${PIPESTATUS[1]:-0}"
          status="$gradle_status"
          if [[ "$gradle_status" -eq 0 && "$tee_status" -ne 0 ]]; then
            status="$tee_status"
          fi
          if [[ "$status" -ne 0 ]]; then
            excerpt="$(grep -n -E 'FAILURE:|What went wrong|^e: |error:|Lint found [0-9]+ error' -A 20 artifacts/build.log 2>/dev/null | tail -n 60)"
            [[ -n "$excerpt" ]] || excerpt="$(tail -n 60 artifacts/build.log 2>/dev/null)"
            {
              echo "### xiaomi failed"
              echo ''
              echo "\`gradle=${gradle_status} tee=${tee_status}\`"
              echo ''
              echo '```text'
              printf '%s\n' "$excerpt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg="$(printf '%s\n' "$excerpt" | grep -v '^[[:space:]]*$' | head -n 8 \
              | tr '\n' ' ' | tr -s ' ' | cut -c1-900 | sed 's/%/%25/g')"
            echo "::error title=xiaomi failed (gradle=${gradle_status}, tee=${tee_status})::${msg}"
          fi
          exit "$status"
      - name: Verify APK and write metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(app/build/outputs/apk/xiaomi/release/CarVex_xiaomi_release_*.apk)
          [[ ${#APKS[@]} -eq 1 ]]
          APK="${APKS[0]}"
          cp "$APK" artifacts/
          APK_NAME="$(basename "$APK")"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "artifacts/$APK_NAME" > "artifacts/signature-xiaomi.txt"
          # 版本号从 APK 里读回来：构建由 checkout 派生版本，这是唯一不可能与实际产物不一致的值。
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          printf 'Brand: %s\nAPK: %s\nCommit: %s\nVersion code: %s\nVersion name: %s\nRun: %s\n' \
            "xiaomi" "$APK_NAME" "$COMMIT_SHA" "$VERSION_CODE" "$VERSION_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "artifacts/build-info-xiaomi.txt"
          printf '### xiaomi\n\n- APK: `%s`\n- Version code: %s (%s)\n- Video, touch and compatibility require vehicle acceptance.\n- Vehicle audio and microphone are source-integrated and await in-vehicle acceptance.\n' \
            "$APK_NAME" "$VERSION_CODE" "$VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-xiaomi
          path: |
            artifacts/*.apk
            artifacts/build-info-xiaomi.txt
            artifacts/signature-xiaomi.txt
          retention-days: 90
      - name: Reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}-xiaomi
          path: |
            artifacts/build.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

  # 汇总：把打包 job 的 APK 取回来，算校验和、拼元数据、发预发布版本。
  # 依赖 protocol-tests 是刻意的：出包必须建立在协议与宿主测试通过之上，
  # 不让编译通过但行为回归的提交拿到一个可下载的包。
  publish:
    needs: [protocol-tests, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-xiaomi
          path: artifacts
      - name: Checksums and metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          APKS=(*.apk)
          if [[ ${#APKS[@]} -ne 1 ]]; then
            echo "应有 1 个 APK，实际 ${#APKS[@]} 个：${APKS[*]:-<none>}" >&2
            exit 1
          fi
          cp build-info-xiaomi.txt build-info.txt
          sha256sum *.apk > SHA256SUMS
          {
            echo '### Signed experimental APK'
            echo ''
            cat build-info.txt
            echo ''
            echo '单品牌构建：仅 `xiaomi`（`com.baidu.carlife.xiaomi`）。'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh
      - name: Publish downloadable experimental build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="build-${BUILD_NUMBER}"
          mapfile -t ASSETS < <(ls artifacts/*.apk artifacts/SHA256SUMS artifacts/build-info.txt)
          # 重跑同一 run 时 tag 已存在：create 会失败，改成覆盖上传，rerun 才不会卡在这里。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$COMMIT_SHA" --title "Experimental build ${BUILD_NUMBER}" --prerelease \
              --notes "Signed xiaomi build from ${COMMIT_SHA}. Android 10+. Protocol/UI build for vehicle validation. Vehicle audio and microphone transfer are not implemented. Follow README and docs/ACCEPTANCE.zh-CN.md."
          fi
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_number }}
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS
            artifacts/build-info.txt
          retention-days: 90
